# =========================================================================
# Nginx: sirve la aplicación React (archivos estáticos). La API la enruta Caddy, no este servidor.
# =========================================================================

# Mapa de security headers (se incluye en cada location)
# IMPORTANTE en nginx: si una `location` declara `add_header`, NO hereda
# los del bloque `server`. Por eso encapsulamos los security headers en
# una variable común vía `map` + `include` no es trivial; replicarlos
# explícitamente por bloque es lo más legible.

server {
    listen 80;
    server_name _;

    server_tokens off;

    # =========================================================
    # GZIP
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # =========================================================
    # HEALTH (frontend)
    # =========================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # =========================================================
    # ASSETS estáticos con hash → cache inmutable de 1 año.
    # =========================================================
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|map|wasm)$ {
        # Security headers (replicados — locations no heredan add_header)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # =========================================================
    # SPA fallback: HTML siempre fresco.
    # =========================================================
    location / {
        # Security headers completos para HTML
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # HSTS: descomenta cuando sirvas por HTTPS (detrás de un proxy TLS).
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP: permitimos imágenes externas vía HTTPS (logos de empresa).
        # Mantenemos scripts/styles estrictos: solo 'self' (CSP previene XSS).
        # 'wasm-unsafe-eval' solo habilita compilar WebAssembly (el lector QR de iPhone,
        # Firefox y Windows, servido por el propio sitio); no habilita eval() de JavaScript.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
