# =========================================================================
# Entorno de QA (fase 7): el MISMO deploy/docker-compose.yml de producción con
# este override encima, en el proyecto compose `inventario_qa`. Lo maneja
# herramientas/qa/entorno.sh (nunca a mano con `-p inventario`).
#
# Diferencias con producción (y nada más):
#   - Volúmenes propios inventario_qa_* (los de producción nunca se montan).
#   - Puertos solo en 127.0.0.1 (HTTP_PORT/HTTPS_PORT del .env de QA).
#   - Correo a Mailpit (doble SMTP) y Active Directory al doble de Samba AD.
#   - Respaldos periódicos en la carpeta de QA, porque es la versión que se usa para
#     probar; sin réplica fuera del equipo.
#   - Secretos propios de QA (api/var/qa/qa.env, generados, no versionados).
# La base se restaura del último Data Pump de producción y la migra el migrador
# (repone las políticas VPD que Data Pump no trae).
# =========================================================================

# ENVIRONMENT sigue en production (como el stack base): QA se comporta igual que
# producción (cookies Secure, errores sin detalle, validaciones de arranque).
x-qa-php: &qa_php
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_TLS: "false"
  SMTP_STARTTLS: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  EMAIL_ENABLED: "true"
  AD_CA_CERT_FILE: /run/qa/samba-ad-ca.pem
  # Solo QA: el administrador del sistema puede apagar el MFA obligatorio. Producción no define esta variable.
  MFA_CAN_BE_DISABLED: "true"

services:
  # Imágenes con etiqueta propia (:qa), construidas del árbol de trabajo: las
  # de producción (:latest) no se tocan y un `up` de producción nunca toma
  # cambios que aún no se aprobaron.
  migrador:
    image: inventario-php:qa
  api_php:
    image: inventario-php:qa
    environment:
      <<: *qa_php
    volumes:
      - ${QA_DIR:?definir QA_DIR}/samba-ad-ca.pem:/run/qa/samba-ad-ca.pem:ro

  worker_php:
    image: inventario-php:qa
    environment:
      <<: *qa_php
    volumes:
      - ${QA_DIR}/samba-ad-ca.pem:/run/qa/samba-ad-ca.pem:ro

  frontend:
    image: inventario-frontend:qa

  caddy:
    networks:
      salida:
        # Nombre con el que los navegadores y escáneres en contenedor llegan al sitio.
        aliases: [qa.inventario.local]

  # Doble SMTP: los correos se consultan por su API (http://mailpit:8025) o en
  # http://127.0.0.1:${QA_MAILPIT_PORT}.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks: [salida]
    ports:
      - "127.0.0.1:${QA_MAILPIT_PORT:-18025}:8025"
    security_opt: ["no-new-privileges:true"]

  # Doble de Active Directory (docker/pruebas/samba-ad). Nunca el AD real.
  samba_ad:
    image: inventario-samba-ad-pruebas:latest
    restart: unless-stopped
    hostname: dc1
    networks:
      salida:
        aliases: [dc1.pruebas.local]

  backup_replica:
    profiles: ["qa-nunca"]

volumes:
  oracle_data:
    name: inventario_qa_oracle_data
  caddy_data:
    name: inventario_qa_caddy_data
  caddy_config:
    name: inventario_qa_caddy_config
  adjuntos_data:
    name: inventario_qa_adjuntos_data
  minio_data:
    name: inventario_qa_minio_data
