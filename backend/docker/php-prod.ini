; Solo en la imagen de producción (el código no cambia dentro del contenedor).
; OPcache: sin revisar en disco la fecha de cada archivo en cada uso; memoria para todo
; Symfony y sus cadenas. Un despliegue crea un contenedor nuevo: no hace falta invalidar.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; Las aserciones son de desarrollo: en producción no se compilan ni se evalúan.
zend.assertions = -1
; Un error nunca se escribe en la respuesta: va al registro (stderr, que recoge Docker).
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
