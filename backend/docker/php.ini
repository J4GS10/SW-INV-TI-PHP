; Límites de PHP para la API (también en dev/pruebas).
; Adjuntos: hasta MAX_UPLOAD_SIZE_MB (10) y la importación desde Excel (5 MB);
; el tope fino lo aplica la aplicación con el código del contrato (413).
upload_max_filesize = 16M
post_max_size = 18M
max_file_uploads = 5
; Las actas y los PDF de etiquetas o de la hoja de vida se arman en memoria.
memory_limit = 512M
expose_php = Off
