name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Análisis estático y pruebas contra Oracle 21c XE
        run: |
          docker build -f docker/Dockerfile --target dev -t inventario-php-dev .
          docker run --rm -v "$PWD:/repo" -w /repo/api inventario-php-dev sh -c \
            'composer install --no-interaction --no-progress -q && php vendor/bin/phpstan analyse --no-progress'
          bash herramientas/pruebas.sh
      - name: Imagen de producción
        run: docker build -f docker/Dockerfile --target prod -t inventario-php .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
